name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build agent binaries
        run: make build-agent-all

      - name: Package skills
        run: |
          tar --exclude='__pycache__' --exclude='*.py[cod]' \
            -czf dist/obsisync/obsidian-sync-skills.tar.gz SKILLS
          tar -tzf dist/obsisync/obsidian-sync-skills.tar.gz \
            | grep -Fx 'SKILLS/knowledge-management/SKILL.md'

      - name: Package binaries
        run: |
          cd dist/obsisync
          for f in obsisync-*; do
            case "$f" in
              *.exe) zip "${f%.exe}.zip" "$f" ;;
              *) tar -czf "$f.tar.gz" "$f" ;;
            esac
          done
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/obsisync/*.tar.gz
            dist/obsisync/*.zip
            dist/obsisync/checksums.txt
